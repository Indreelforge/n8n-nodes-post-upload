# Runs n8n's community package scanner against a published version.
# Triggered after every successful Publish run, or by hand with a version.
name: Scan

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published version to scan (e.g. 1.3.1)
        required: true

jobs:
  scan:
    name: n8n community package scan
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          # The scanner's native dependency (isolated-vm) builds on Node 22.
          node-version: '22'
      - name: Install the scanner
        run: npm install -g @n8n/scan-community-package
      - name: Scan
        env:
          VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
        run: scan-community-package "n8n-nodes-post-upload@${VERSION}"
