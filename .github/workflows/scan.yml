# Runs n8n's community package scanner against a published version.
# Triggered after every successful Publish run, or by hand with a version.
name: Scan

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published version to scan (e.g. 1.3.1)
        required: true

jobs:
  scan:
    name: n8n community package scan
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          # The scanner's native dependency (isolated-vm) builds on Node 22.
          node-version: '22'
      - name: Scan
        # The scanner's dependencies only install with pnpm (only-allow pnpm).
        env:
          VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
        run: |
          # The registry can take a minute to serve a just-published version.
          for i in $(seq 1 30); do
            [ "$(npm view "n8n-nodes-post-upload@${VERSION}" version 2>/dev/null)" = "${VERSION}" ] && break
            echo "waiting for n8n-nodes-post-upload@${VERSION} on npm…"; sleep 10
          done
          npx -y pnpm@10 dlx @n8n/scan-community-package "n8n-nodes-post-upload@${VERSION}"
